[project]
name = "ai-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sxmtee", email = "somtoo76@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.1.0",
    "huggingface-hub>=2.4.0",
    "jupyterlab>=4.6.5",
    "line-profiler>=5.1.0",
    "matplotlib>=3.11.2",
    "memory-profiler>=0.61.0",
    "numpy<2",
    "pandas<2.3",
    "tensorboard>=2.21.0",
    "torch==2.2.2",
]

[project.scripts]
ai-practice = "ai_practice:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
